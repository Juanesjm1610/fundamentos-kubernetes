apiVersion: apps/v1
kind: Deployment
metadata:
  name: mi-app
spec:
  replicas: # TODO: número de réplicas
  selector:
    matchLabels:
      app: # TODO: debe coincidir con las etiquetas del template
  template:
    metadata:
      labels:
        app: mi-app
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
